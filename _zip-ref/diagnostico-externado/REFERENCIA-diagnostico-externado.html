<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico Empresarial Externado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Sistema visual: Refero · Hyper Foundation. Lienzo oscuro a sangre completa (Forest Depths)
   con manchas orgánicas difuminadas; un solo acento saturado (Mint Glow) para acción y énfasis;
   serif de alto contraste para titulares, Inter 300 para texto; píldoras de 60px, tarjetas de 12px,
   elevación expresada solo con el brillo menta. Contenedor máximo 1200px. Tema oscuro único. */
:root{
  /* Paleta de referencia (nombres y roles de Refero) */
  --forest-depths:#072724;   /* lienzo */
  --abyss-green:#122d28;     /* mancha más oscura */
  --deep-lagoon:#1c3f38;     /* mancha media */
  --midnight-tide:#0f3933;   /* bordes fuertes, texto sobre botón menta */
  --shadow-teal:#23524c;     /* tarjetas y superficies elevadas */
  --mist-gray:#b0c5c1;       /* párrafos y texto secundario */
  --pure-light:#ffffff;      /* titulares */
  --mint-glow:#97fcd7;       /* único color saturado: acción y énfasis */
  --teal-pulse:#33998c;      /* trazos SVG, luz de borde, estados hover */
  --glow:0 0 20px 5px rgba(151,252,215,.4); /* única sombra permitida */

  /* Alias de uso */
  --bg:var(--forest-depths); --fg:var(--pure-light); --muted:var(--mist-gray);
  --faint:rgba(176,197,193,.74); --line:rgba(176,197,193,.14); --line-strong:rgba(176,197,193,.32);
  --card:var(--shadow-teal); --card-border:var(--midnight-tide); --inset:rgba(7,39,36,.42);
  --mint-soft:rgba(151,252,215,.08); --pulse-soft:rgba(51,153,140,.20);
  --logo:var(--pure-light);

  --f-display:"Inter Tight", "Inter", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
  --r-pill:60px; --r-pill-lg:37px; --r-card:12px;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{background:var(--forest-depths)}
body{background:var(--bg);color:var(--muted);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.5;font-feature-settings:"kern";-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:inherit;color:var(--fg)}
strong{font-weight:500;color:var(--fg)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--mint-glow);outline-offset:3px;border-radius:12px}
[tabindex="-1"]:focus{outline:none}

.app{position:relative;min-height:100vh;display:flex;flex-direction:column;isolation:isolate}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.main{flex:1;position:relative;z-index:1;padding-bottom:50px}

/* ---- Atmósfera: manchas en capas sobre Forest Depths ---- */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--forest-depths)}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.fluid{position:absolute;inset:0;width:100%;height:100%;display:block}
.b-abyss{width:82vmax;height:82vmax;left:-30vmax;top:-34vmax;background:var(--abyss-green);opacity:.95;animation:driftA 34s ease-in-out infinite alternate}
.b-lagoon{width:60vmax;height:52vmax;right:-22vmax;bottom:-26vmax;background:var(--deep-lagoon);opacity:.9;border-radius:46% 54% 60% 40%;animation:driftB 40s ease-in-out infinite alternate}
.b-teal{width:34vmax;height:30vmax;right:4vmax;bottom:-12vmax;background:var(--shadow-teal);opacity:.75;border-radius:58% 42% 50% 50%;animation:driftA 30s ease-in-out infinite alternate-reverse}
.b-rim{width:22vmax;height:16vmax;right:14vmax;bottom:-9vmax;background:var(--teal-pulse);opacity:.28;filter:blur(110px);animation:driftB 26s ease-in-out infinite alternate}
@keyframes driftA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3vmax,2vmax,0) scale(1.06)}}
@keyframes driftB{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(-3vmax,-2vmax,0) rotate(8deg)}}

/* ---- Barra superior transparente ---- */
/* ---- Barra flotante ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--forest-depths)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding:14px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top-in{pointer-events:auto;max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:64px;padding:8px 8px 8px 22px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.7);border-radius:999px;box-shadow:0 18px 40px -22px rgba(0,0,0,.55),0 0 0 1px rgba(7,39,36,.05);transition:max-width .5s cubic-bezier(.2,.7,.2,1),min-height .4s,box-shadow .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
.top-in:hover{transform:scale(1.008);box-shadow:0 22px 48px -22px rgba(0,0,0,.6),0 0 0 1px rgba(151,252,215,.75),0 0 30px 0 rgba(151,252,215,.32)}
.top.scrolled .top-in{max-width:1060px;min-height:58px}

.logo-dark{background:#0B0B0B;width:112px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 6px;margin-left:-6px;cursor:pointer;flex:none;border-radius:14px;transition:transform .25s}
.brand:hover{transform:scale(1.03)}
.brand-sep{width:1px;height:28px;background:rgba(7,39,36,.2)}
.brand-sub{font-size:12.5px;line-height:1.2;color:#2D3A37;text-align:left;font-weight:500}
.top :focus-visible,.drawer :focus-visible{outline-color:#072724}
.nav{flex:1;min-width:0;display:flex;justify-content:center}
.nav ul{position:relative;list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:2px}
.nav-hl{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:rgba(7,39,36,.07);box-shadow:0 0 0 1px rgba(51,153,140,.25),0 0 18px rgba(151,252,215,.45);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),opacity .25s;pointer-events:none}
.nav-hl.show{opacity:1}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:10px 15px;border-radius:999px;font-size:15px;font-weight:500;color:#25322F;cursor:pointer;text-decoration:none;white-space:nowrap;transition:color .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.nav-link:hover{color:#000;transform:scale(1.06)}
.nav-link.on{color:#000}
.nav-link.on::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--teal-pulse);box-shadow:0 0 8px var(--mint-glow)}
.nav-link.ext svg{opacity:.65}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn-dark{background:#072724;color:#FFFFFF;border-color:#072724}
.btn-dark:not(:disabled):hover{transform:scale(1.05);box-shadow:0 0 0 4px rgba(151,252,215,.35),0 0 26px rgba(151,252,215,.55)}
.btn-cta{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.top .restart .btn{padding:11px 20px;min-height:46px}
.menu-btn{display:none;width:46px;height:46px;border-radius:999px;border:0;background:rgba(7,39,36,.06);cursor:pointer;place-items:center;flex:none;transition:transform .25s,box-shadow .25s}
.menu-btn:hover{transform:scale(1.06);box-shadow:0 0 18px rgba(151,252,215,.6)}
.burger{position:relative;width:18px;height:13px;display:block}
.burger span{position:absolute;left:0;height:1.6px;background:#072724;border-radius:2px}
.burger span:nth-child(1){top:0;right:0}.burger span:nth-child(2){top:5.7px;right:4px}.burger span:nth-child(3){top:11.4px;right:8px}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(3,18,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:80;top:0;bottom:0;left:0;width:min(340px,86vw);background:#FFFFFF;color:#0B1A17;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));border-radius:0 28px 28px 0;box-shadow:24px 0 60px -30px rgba(0,0,0,.6);transform:translateX(-104%);transition:transform .42s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;justify-content:space-between}
.drawer-head .logo-dark{width:120px}
.drawer-close{color:#072724;border-color:rgba(7,39,36,.18)}
.drawer-sub{margin:10px 0 18px;font-size:13px;color:#4A5B57}
.drawer-links{list-style:none;margin:0;padding:12px 0;display:grid;gap:4px;border-top:1px solid rgba(7,39,36,.1)}
.drawer .nav-link{width:100%;justify-content:flex-start;padding:15px 16px;font-size:18px;border-radius:16px;font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.drawer .nav-link:hover{transform:none;background:rgba(7,39,36,.06)}
.drawer .nav-link.on{background:rgba(151,252,215,.35)}
.drawer .nav-link.on::after{display:none}
.drawer-foot{margin-top:auto;display:grid;gap:10px}
.drawer-foot .restart .btn{width:100%}
.drawer-note{font-size:13px;color:#4A5B57;text-align:center}
@media (max-width:1240px){.brand-sub,.brand-sep{display:none}}
.top.scrolled .brand-sub,.top.scrolled .brand-sep{display:none}
@media (max-width:920px){
  .nav{display:none}
  .menu-btn{display:grid}
  .top-in{padding-left:8px;gap:10px}
  .brand-sub,.brand-sep{display:block}
}
@media (max-width:480px){.brand-sub,.brand-sep{display:none}.cta-long{display:none}.logo-dark{width:96px}.top-in{min-height:58px}}
@media (max-width:480px){.colibri{width:64px;height:64px;opacity:.3}}

/* ---- Tipografía (escala de referencia) ---- */
.display{font-family:var(--f-display);font-weight:400;color:var(--fg);letter-spacing:normal;text-wrap:balance}
.section-title{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,4.6vw,55px);line-height:1;color:var(--fg);text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.5}
.h3{font-size:20px;line-height:1.3;font-weight:400;color:var(--fg)}
.eyebrow{font-size:16px;font-weight:400;color:var(--mint-glow)}
.micro{font-size:12px;line-height:1.5;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.micro.accent{color:var(--mint-glow)}
.lead{font-size:20px;line-height:1.3;color:var(--muted);max-width:560px}
.lead.sm{font-size:16px;line-height:1.5}
.fine{font-size:12px;line-height:1.5;color:var(--faint);max-width:64ch}
.fine.center{text-align:center;margin-inline:auto}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","kern"}

/* ---- Botones píldora ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:var(--r-pill);padding:14px 28px;font-weight:400;font-size:16px;line-height:1.2;cursor:pointer;transition:box-shadow .3s ease,background-color .3s ease,border-color .3s ease,color .3s ease,opacity .2s;white-space:nowrap;min-height:48px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn svg{flex:none}
.btn-primary{background:var(--mint-glow);color:var(--midnight-tide)}
.btn-primary:not(:disabled):hover{box-shadow:var(--glow)}
.btn-ghost{background:transparent;border-color:var(--mint-glow);color:var(--mint-glow)}
.btn-ghost:not(:disabled):hover{background:var(--pulse-soft);border-color:var(--teal-pulse)}
.btn-soft{background:var(--pulse-soft);border-color:var(--teal-pulse);color:var(--fg)}
.btn-sm{padding:9px 20px;min-height:40px}
.btn-block{width:100%}
.link-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--mint-glow);font-size:16px;font-weight:400;cursor:pointer;border-radius:var(--r-pill)}
.link-btn:hover{color:var(--fg)}
.aside .link-btn{font-size:14px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:transparent;cursor:pointer;color:var(--muted);transition:all .25s;flex:none}
.icon-btn:hover{border-color:var(--teal-pulse);background:var(--pulse-soft);color:var(--fg)}

/* ---- Tags y tarjetas ---- */
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mint-glow);border-radius:var(--r-pill);padding:6px 14px;font-size:13px;font-weight:400;line-height:1.3;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card)}
.glow-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card);box-shadow:var(--glow)}

.restart{position:relative}
.restart .btn{padding:9px 20px;min-height:40px}
.r-side .restart .btn,.demo-foot .restart .btn{width:100%;padding:14px 28px;min-height:48px}
.restart-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:30;width:min(320px,calc(100vw - 32px));background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card);padding:20px;display:grid;gap:14px;animation:pop .2s ease}
.restart-pop p{color:var(--fg);font-weight:400}
.restart-pop .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.restart-pop .btn{width:auto!important;min-height:40px!important;padding:9px 20px!important}
.demo-foot .restart-pop,.r-side .restart-pop{top:auto;bottom:calc(100% + 10px)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---- Bienvenida: pila centrada ---- */
.welcome{display:grid;justify-items:center;text-align:center;gap:24px;padding-block:clamp(56px,11vh,120px) 40px}
.w-title{font-size:clamp(48px,7.6vw,90px);line-height:.95;max-width:15ch}
.w-lead{margin-inline:auto}
.w-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:8px}
.w-meta{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;margin:6px 0 0;padding:0;font-size:16px;color:var(--muted)}
.w-meta li{display:inline-flex;align-items:center;gap:8px}
.w-meta li+li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--teal-pulse);margin-right:16px}
.w-note{font-size:12px;color:var(--faint);max-width:440px}
.section{display:grid;gap:40px;padding-block:100px 20px;outline:none;scroll-margin-top:72px}
.section-head{display:grid;gap:14px;max-width:760px}
.section-head.split{max-width:none;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px 60px;align-items:end}
.section-lead{font-size:16px;color:var(--muted);max-width:52ch}
@media (max-width:860px){.section-head.split{grid-template-columns:1fr}}
.sol-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:980px){.sol-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.sol-grid{grid-template-columns:1fr}}
.sol-card{padding:24px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;align-content:start;transition:border-color .3s,box-shadow .3s}
.sol-card:hover{border-color:var(--teal-pulse)}
.sol-card .tag{justify-self:start}
.sol-card h3{font-size:20px;line-height:1.3;font-weight:400}
.sol-card p{font-size:15px}
.sol-go{justify-self:start;margin-top:6px}
.pending-note{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.team-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
@media (max-width:1080px){.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.team-grid{grid-template-columns:1fr}}
.team-card{padding:24px;display:grid;gap:16px;align-content:start;min-width:0}
.team-card.is-pending{border-style:dashed;border-color:var(--line-strong);background:rgba(35,82,76,.55)}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--teal-pulse);font-family:var(--f-display);font-size:24px;color:var(--fg)}
.team-id{display:grid;gap:2px;min-width:0}
.team-id h3{font-size:20px;line-height:1.3;font-weight:400;overflow-wrap:anywhere}
.team-id p{font-size:14px}
.team-links{display:flex;flex-wrap:wrap;gap:8px}
.team-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mint-glow);border-radius:var(--r-pill);padding:6px 14px;font-size:13px;font-weight:400;color:var(--fg);text-decoration:none;transition:background-color .2s}
a.team-link:hover{background:var(--pulse-soft)}
.team-link.pending{border-color:var(--line-strong);border-style:dashed;color:var(--faint)}
.team-link.mail{border-color:var(--line-strong);user-select:all;overflow-wrap:anywhere}
.dept-card{background:var(--inset)}
.dept-card h3{font-size:20px;line-height:1.3;font-weight:400}
.dept-card .btn{justify-self:start}
.how-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.how-grid li{padding:24px;display:grid;gap:10px;align-content:start}
.how-grid h3{font-size:20px;line-height:1.3;font-weight:400}
.how-n{width:36px;height:36px;border-radius:var(--r-pill);border:1px solid var(--teal-pulse);display:grid;place-items:center;font-size:14px;font-weight:400;color:var(--fg);margin-bottom:6px}
@media (max-width:820px){.how-grid{grid-template-columns:1fr}}

/* ---- Formulario ---- */
.flow{padding-block:24px 30px;display:grid;gap:40px}
.progress{display:grid;gap:12px}
.progress-label{font-size:14px;font-weight:400;color:var(--muted)}
.progress ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.seg button{width:100%;background:none;border:0;padding:0 0 4px;display:grid;gap:10px;text-align:left;cursor:pointer;border-radius:8px}
.seg button:disabled{cursor:default}
.seg-bar{display:block;height:3px;border-radius:var(--r-pill);background:var(--line);position:relative;overflow:hidden}
.seg-bar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--teal-pulse);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.seg.done .seg-bar::after{transform:scaleX(1)}
.seg.current .seg-bar::after{transform:scaleX(1);background:var(--mint-glow)}
.seg-name{font-size:14px;color:var(--faint);transition:color .25s}
.seg.done .seg-name{color:var(--muted)}
.seg.current .seg-name{color:var(--fg);font-weight:400}
.seg button:not(:disabled):hover .seg-name{color:var(--mint-glow)}
@media (max-width:520px){.seg-name{font-size:12px}}

.flow-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:50px;align-items:start}
@media (max-width:980px){.flow-grid{grid-template-columns:1fr}.aside{display:none}}
.q-card{display:grid;gap:40px;min-width:0}
.q-anim{display:grid;gap:16px;animation:inFwd .45s cubic-bezier(.2,.7,.2,1)}
.q-anim.bwd{animation-name:inBwd}
@keyframes inFwd{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes inBwd{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.q-num{font-size:14px;font-weight:400;color:var(--mint-glow)}
.q-num span{color:var(--faint)}
.q-title{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,4.4vw,55px);line-height:1.04;text-wrap:balance;max-width:20ch}
.q-help{font-size:16px;color:var(--muted);max-width:56ch}
.field{position:relative;margin-top:14px}
.text-in{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-strong);padding:10px 64px 16px 0;font-family:var(--f-display);font-size:clamp(28px,3.4vw,40px);line-height:1.2;color:var(--fg);border-radius:0;transition:border-color .3s}
.text-in::placeholder{color:rgba(176,197,193,.42)}
.text-in:focus{outline:none;border-bottom-color:var(--mint-glow)}
.text-in[aria-invalid="true"]{border-bottom-color:var(--teal-pulse);border-bottom-width:2px}
.text-in.sm{font-family:var(--f-body);font-weight:300;font-size:20px;padding-right:0}
.count{position:absolute;right:0;bottom:18px;font-size:12px;color:var(--faint)}
.other{display:grid;gap:4px}
.other-label{font-size:16px;color:var(--muted)}
.other-label span{color:var(--faint)}
.err{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:16px;font-weight:400}
.err:not(:empty)::before{content:"!";flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--mint-glow);color:var(--mint-glow);display:grid;place-items:center;font-size:13px;font-weight:500}
.err:empty{display:none}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:10px}
.opts.compact{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
@media (max-width:520px){.opts,.opts.compact{grid-template-columns:1fr}}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt-body{display:flex;gap:14px;align-items:flex-start;height:100%;padding:20px;border:1px solid var(--card-border);border-radius:var(--r-card);background:var(--card);transition:border-color .3s,box-shadow .3s,background-color .3s}
.opt:hover .opt-body{border-color:var(--teal-pulse)}
.opt.on .opt-body{border-color:var(--mint-glow);box-shadow:var(--glow)}
.opt input:focus-visible+.opt-body{outline:2px solid var(--mint-glow);outline-offset:3px}
.opt-mark{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:all .25s;margin-top:1px}
.opt-mark svg{width:13px;height:13px}
.opt.on .opt-mark{background:var(--mint-glow);border-color:var(--mint-glow);color:var(--midnight-tide)}
.opt-text{display:grid;gap:4px;min-width:0}
.opt-label{font-weight:400;color:var(--fg);line-height:1.3}
.opt-hint{font-size:14px;color:var(--muted);line-height:1.45}
.opts[aria-invalid="true"] .opt-body{border-color:var(--teal-pulse)}

.q-nav{display:flex;justify-content:space-between;gap:12px;padding-top:8px}

.aside{position:sticky;top:24px;padding:24px;display:grid;gap:16px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card)}
.aside dl{margin:0;display:grid}
.aside-row{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.aside-row:first-child{border-top:0;padding-top:2px}
.aside-row dt{font-size:12px;color:var(--faint)}
.aside-row dd{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px;color:var(--fg);font-weight:400;min-width:0}
.aside-row dd>span:first-child{min-width:0;overflow-wrap:anywhere}
.aside-row.current dt{color:var(--mint-glow)}
.empty{color:var(--faint)!important;font-weight:300}
.aside-note{font-size:12px;color:var(--faint)}

/* ---- Análisis ---- */
.analyzing{display:grid;justify-items:center;gap:30px;padding-block:clamp(70px,13vh,140px) 50px;text-align:center}
.orbit{position:relative;width:120px;height:120px}
.orbit span{position:absolute;inset:0;border-radius:46% 54% 52% 48%;border:1px solid var(--teal-pulse);opacity:.7;animation:spin 7s linear infinite}
.orbit span:nth-child(2){inset:16px;border-radius:55% 45% 40% 60%;opacity:.5;animation-duration:5s;animation-direction:reverse}
.orbit span:nth-child(3){inset:38px;border:0;background:var(--mint-glow);box-shadow:var(--glow);opacity:.9;animation:breathe 2.6s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{from{transform:scale(.85)}to{transform:scale(1)}}
.a-title{font-family:var(--f-display);font-size:clamp(36px,4.6vw,55px);line-height:1;font-weight:400}
.a-list{list-style:none;margin:0;padding:0;display:grid;gap:16px;text-align:left}
.a-list li{display:flex;align-items:center;gap:14px;font-size:20px;line-height:1.3;transition:color .4s,opacity .4s}
.a-list li.todo{opacity:.4}
.a-list li.now{color:var(--fg)}
.a-dot{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;flex:none;color:var(--midnight-tide)}
.a-list li.done .a-dot{background:var(--teal-pulse);border-color:var(--teal-pulse);color:var(--fg)}
.a-list li.now .a-dot{border-color:var(--mint-glow);border-top-color:transparent;animation:spin 1s linear infinite}

/* ---- Resultados ---- */
.results{padding-block:30px 30px;display:grid;gap:40px}
.r-head{display:grid;gap:18px}
.r-title{font-size:clamp(48px,7vw,90px);line-height:.95;overflow-wrap:anywhere}
.r-facts{margin:16px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.r-facts>div{padding:20px;display:grid;gap:6px;min-width:0;background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card)}
.r-facts dt{font-size:12px;color:var(--faint)}
.r-facts dd{margin:0;color:var(--fg);font-weight:400;font-size:16px;overflow-wrap:anywhere}
@media (max-width:820px){.r-facts{grid-template-columns:1fr 1fr}}
.urg{display:inline-flex;align-items:center;gap:10px}
.urg-bars{display:inline-flex;gap:4px}
.urg-bars span{width:16px;height:6px;border-radius:var(--r-pill);background:var(--line-strong)}
.urg-bars span.on{background:var(--mint-glow)}
.urg-bars span.dash{background:transparent;border:1px dashed var(--line-strong)}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:20px 24px;border-radius:var(--r-card);border:1px solid var(--teal-pulse);background:var(--pulse-soft)}
.callout p{flex:1 1 320px;color:var(--muted)}
.r-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:60px;align-items:start}
@media (max-width:980px){.r-grid{grid-template-columns:1fr;gap:30px}}
.r-main{display:grid;min-width:0}
.r-block{display:grid;gap:12px;padding-block:32px;border-top:1px solid var(--line);max-width:68ch}
.r-block:first-child{border-top:0;padding-top:0}
.r-block p{line-height:1.6}
.r-block.solution{max-width:none;padding:32px;margin-block:20px}
.r-block.solution+.r-block{border-top:0}
.r-block.solution .btn{justify-self:start;margin-top:8px}
.sol-title{font-size:28px;line-height:1.3;font-weight:300;color:var(--fg);text-wrap:balance;max-width:28ch}
.pre-step{padding:14px 18px;border-radius:var(--r-card);background:var(--inset);border:1px solid var(--card-border)}
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:20px}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:16px}
.step-n{width:38px;height:38px;border-radius:var(--r-pill);border:1px solid var(--teal-pulse);display:grid;place-items:center;font-size:15px;font-weight:400;color:var(--fg)}
.steps h3{font-weight:400;font-size:16px;line-height:1.5}
.steps p{font-size:16px}
.benefits{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
@media (max-width:600px){.benefits{grid-template-columns:1fr}}
.benefits li{display:flex;gap:10px;align-items:flex-start;color:var(--fg);font-weight:300}
.benefits svg{color:var(--teal-pulse);margin-top:4px;flex:none}
.r-side{position:sticky;top:24px;display:grid;gap:16px}
.side-card{padding:24px;display:grid;gap:12px}
.side-text{margin-bottom:6px}

/* ---- Demostración ---- */
.demo{padding-block:24px 30px;display:grid;gap:28px}
.back{justify-self:start}
.d-title{font-size:clamp(40px,5.6vw,60px);line-height:1;margin-block:12px 12px;overflow-wrap:anywhere}
.sample-banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:16px;color:var(--muted)}
.demo-card{padding:clamp(20px,3vw,32px);min-width:0}
.demo-body{display:grid;gap:20px;min-width:0}
.demo-toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.demo-explain{font-size:14px;color:var(--muted);max-width:76ch}
.demo-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.demo-foot .restart{min-width:min(300px,100%)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filter{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:transparent;border-radius:var(--r-pill);padding:7px 16px;font-size:14px;font-weight:400;cursor:pointer;color:var(--muted);transition:all .25s;min-height:38px}
.filter:hover{border-color:var(--teal-pulse);color:var(--fg)}
.filter.on{border-color:var(--mint-glow);color:var(--fg);background:var(--mint-soft)}
.count-pill{font-size:12px;background:var(--inset);border-radius:var(--r-pill);padding:1px 8px;color:var(--fg)}

.pipe,.tasks{list-style:none;margin:0;padding:0;display:grid}
.pipe-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 116px 190px;gap:18px;align-items:center;padding:16px 4px;border-top:1px solid var(--line);transition:opacity .3s}
.pipe-row:first-child,.task:first-child{border-top:0}
.pipe-row.is-done{opacity:.55}
.pipe-name,.task-title{color:var(--fg);font-weight:400;overflow-wrap:anywhere}
.pipe-meta{font-size:14px;color:var(--muted)}
.pipe-score{display:flex;align-items:center;gap:10px}
.meter{flex:1;height:6px;border-radius:var(--r-pill);background:var(--inset);overflow:hidden}
.meter span{display:block;height:100%;border-radius:inherit;transition:width .5s ease}
.meter .alta{background:var(--mint-glow)}.meter .media{background:var(--teal-pulse)}.meter .baja{background:rgba(176,197,193,.45)}
.pipe-score .num{width:28px;text-align:right;color:var(--fg);font-size:14px}
/* Prioridad codificada por forma, sin colores fuera de la paleta */
.prio{display:inline-flex;justify-content:center;align-items:center;font-size:13px;font-weight:400;border-radius:var(--r-pill);padding:5px 14px;white-space:nowrap;border:1px solid transparent}
.prio.alta{background:var(--mint-glow);color:var(--midnight-tide)}
.prio.media{border-color:var(--mint-glow);color:var(--fg)}
.prio.baja,.prio.ok{border-color:var(--line-strong);color:var(--muted)}
.prio.done{border:1px dashed var(--line-strong);color:var(--muted)}
.prio-btn{cursor:pointer;min-width:78px;transition:box-shadow .25s}
.prio-btn:hover{box-shadow:0 0 0 1px var(--teal-pulse)}
.pipe-empty{padding:24px 4px;color:var(--muted)}
@media (max-width:780px){
  .pipe-row{grid-template-columns:1fr auto;gap:10px 12px}
  .pipe-main,.pipe-score{grid-column:1/-1}
  .pipe-row .btn{justify-self:end}
}

.task-form{display:grid;grid-template-columns:minmax(0,1fr) 140px 170px auto;gap:12px;align-items:end;padding-bottom:20px;border-bottom:1px solid var(--line)}
.task-form .err{grid-column:1/-1}
.tf-field{display:grid;gap:6px;min-width:0}
.tf-field label{font-size:12px;color:var(--muted)}
.in{width:100%;min-height:46px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--inset);padding:10px 18px;font-size:16px;color:var(--fg)}
.in::placeholder{color:rgba(176,197,193,.5)}
.in:focus{outline:none;border-color:var(--mint-glow)}
.in[aria-invalid="true"]{border-color:var(--teal-pulse);border-width:2px}
select.in{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 17px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
select.in option{background:var(--midnight-tide);color:var(--fg)}
.tf-add{min-height:46px}
@media (max-width:780px){.task-form{grid-template-columns:1fr 1fr}.tf-field.grow,.tf-add{grid-column:1/-1}}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.task.is-done .task-title{text-decoration:line-through;color:var(--muted)}
.task-check{position:relative;display:grid;place-items:center;width:30px;height:30px;cursor:pointer}
.task-check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.task-check .box{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:all .25s}
.task-check input:checked+.box{background:var(--teal-pulse);border-color:var(--teal-pulse);color:var(--fg)}
.task-check input:focus-visible+.box{outline:2px solid var(--mint-glow);outline-offset:2px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:780px){.kpis{grid-template-columns:1fr 1fr}.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{padding:20px;border-radius:var(--r-card);border:1px solid var(--card-border);background:var(--inset);display:grid;gap:6px;min-width:0}
.kpi-l{font-size:12px;color:var(--muted)}
.kpi-v{font-size:clamp(26px,3vw,35px);line-height:1;font-weight:300;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi-v.hi{color:var(--mint-glow)}
.delta{font-size:12px;color:var(--muted)}
.delta.up span{color:var(--mint-glow)}
.delta.down span{color:var(--mist-gray)}

.table-wrap{overflow-x:auto;border:1px solid var(--card-border);border-radius:var(--r-card)}
.inv{width:100%;border-collapse:collapse;min-width:640px}
.inv th,.inv td{padding:14px 16px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
.inv thead th{border-top:0;font-size:12px;font-weight:400;color:var(--muted);background:var(--midnight-tide)}
.inv .r{text-align:right}
.inv td{color:var(--fg)}
.inv tbody th{font-weight:400;color:var(--fg)}
.inv-name{display:block}
.inv-unit{display:block;font-size:12px;color:var(--faint);font-weight:300}
.inv tr.st-reponer th{box-shadow:inset 3px 0 0 var(--mint-glow)}
.inv tr.st-bajo th{box-shadow:inset 3px 0 0 var(--teal-pulse)}
.stepper{display:flex;gap:6px;justify-content:flex-end}
.order{padding:24px;display:grid;gap:12px;background:var(--inset)}
.order ul{list-style:none;margin:0;padding:0;display:grid}
.order li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);color:var(--fg)}
.order li:first-child{border-top:0}

.chart-card{padding:24px;display:grid;gap:14px;background:var(--inset)}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.chart-wrap{overflow-x:auto}
.chart{width:100%;min-width:440px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.chart .val{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.chart .val.strong{fill:var(--fg);font-weight:500}
.chart .bar{fill:var(--teal-pulse);transition:y .45s,height .45s}
.chart .bar.last{fill:var(--mint-glow)}
.reading{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.reading p:last-child{line-height:1.6;max-width:76ch}

/* ---- Colibrí institucional ---- */
.colibri{position:fixed;z-index:20;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:112px;height:112px;padding:0;border:0;background:transparent;cursor:pointer;opacity:.38;transition:opacity .35s ease,filter .35s ease;border-radius:50%}
.colibri:hover,.colibri:focus-visible{opacity:1}
.colibri img{width:100%;height:100%;object-fit:contain;display:block}
.colibri-fallback{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:1px solid var(--teal-pulse)}
.colibri-fallback span{font-size:13px;font-weight:400;color:var(--fg)}
.colibri-tip{position:absolute;right:0;bottom:calc(100% + 8px);font-size:12px;background:var(--card);border:1px solid var(--mint-glow);color:var(--fg);padding:6px 14px;border-radius:var(--r-pill);white-space:nowrap;opacity:0;transform:translateY(4px);transition:all .25s;pointer-events:none}
.colibri:hover .colibri-tip,.colibri:focus-visible .colibri-tip{opacity:1;transform:none}
@media (max-width:640px){.colibri{width:72px;height:72px}.colibri-fallback span{font-size:11px}.main{padding-bottom:100px}}

/* ---- Pie y avisos ---- */
.foot{position:relative;z-index:1}
.foot{margin-top:60px;background:rgba(7,39,36,.86);border-top:1px solid var(--line)}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:32px 48px;padding-block:48px 32px}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr}}
.foot-brand{display:grid;gap:14px;align-content:start;max-width:420px}
.foot-brand p{font-size:14px}
.foot-col{display:grid;gap:6px;align-content:start}
.foot-col .micro{margin-bottom:6px}
.foot-link{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:none;border:0;padding:4px 0;color:var(--fg);font-size:15px;font-weight:300;cursor:pointer;text-decoration:none;border-radius:6px}
.foot-link:hover{color:var(--mint-glow)}
.foot-base{padding-block:18px 26px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);padding-right:max(150px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.foot-base{padding-right:max(90px,env(safe-area-inset-right,0px))}}
.toast-zone{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100vw - 32px));display:grid;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--mint-glow);color:var(--fg);padding:12px 22px;border-radius:var(--r-pill);font-size:14px;font-weight:400;text-align:center;animation:toast .3s ease}
@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}


/* ---- Apertura ---- */
.app{z-index:1}
.intro-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(70% 60% at 50% 46%,var(--deep-lagoon),var(--forest-depths) 70%);display:grid;place-items:end center;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.intro-mark{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);animation:fadeUp .6s .15s ease both}
.intro-mark span:last-child{padding-left:14px;border-left:1px solid var(--line-strong)}
.intro-logo{width:104px}
.intro-fg{position:fixed;inset:0;z-index:100;pointer-events:none}
.intro-fg .bird{position:absolute;left:0;top:0;width:380px;height:380px;will-change:transform,opacity;transform:translate(-300px,-300px);opacity:0}
.bird img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 18px rgba(151,252,215,.35))}
.bird-hover{width:100%;height:100%;animation:hover .32s ease-in-out infinite alternate}
@keyframes hover{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.bird-orb{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--mint-glow) 0 9%,rgba(151,252,215,.55) 14%,rgba(51,153,140,.22) 34%,transparent 62%)}
.bird.ghost img{filter:none}
.intro-chrome{position:absolute;inset:0}
.intro-skip{position:absolute;pointer-events:auto;top:calc(20px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));background:rgba(7,39,36,.55)}
.intro-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.intro-bar span{display:block;height:100%;background:var(--mint-glow);transform:scaleX(0);transform-origin:left}
.colibri.is-hidden{opacity:0!important;pointer-events:none}
.foot-replay{font-size:12px;margin-left:10px;vertical-align:baseline;padding:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}


/* ---- Tipografía nueva (Inter Tight) ---- */
.display,.section-title,.q-title,.a-title{font-weight:600;letter-spacing:-.035em}
.h2{font-weight:600;letter-spacing:-.02em;font-size:22px}
.text-in{font-weight:500;letter-spacing:-.02em}
.sol-title{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em}
.avatar{font-weight:600;font-size:20px}
h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.012em}
.steps h3,.opt-label{font-family:var(--f-body)}

/* ---- Portada limpia ---- */
.welcome{gap:22px;padding-block:clamp(64px,13vh,150px) 30px}
.w-title{font-size:clamp(44px,7.4vw,92px);line-height:.98;max-width:13ch}
.w-lead{font-size:clamp(17px,1.7vw,20px);max-width:520px}
.btn-lg{padding:16px 30px;min-height:54px;font-size:16px}
.btn-primary,.btn-ghost{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background-color .3s,border-color .3s}
.btn-primary:not(:disabled):hover{transform:scale(1.04)}
.btn-ghost:not(:disabled):hover{transform:scale(1.04)}
.hero-tag{display:inline-flex;align-items:center;gap:10px;padding:7px 16px 7px 12px;border-radius:999px;border:1px solid rgba(151,252,215,.45);background:rgba(7,39,36,.45);font-size:14px;color:var(--fg);font-weight:400}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--mint-glow);box-shadow:0 0 0 0 rgba(151,252,215,.6);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(151,252,215,.55)}80%,100%{box-shadow:0 0 0 10px rgba(151,252,215,0)}}
.welcome .w-meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--faint);margin:0}
.scroll-cue{margin-top:36px;display:grid;justify-items:center;gap:10px;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:12px}
.scroll-cue:hover{color:var(--fg)}
.cue-line{width:1px;height:44px;background:linear-gradient(var(--mint-glow),transparent);position:relative;overflow:hidden}
.cue-line::after{content:"";position:absolute;left:-2px;width:5px;height:12px;border-radius:3px;background:var(--mint-glow);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{from{top:-12px;opacity:1}to{top:44px;opacity:0}}

.section{padding-block:120px 20px;gap:48px;scroll-margin-top:96px}
.section-head.center{justify-items:center;text-align:center;margin-inline:auto;max-width:720px}
.section-head.center .section-lead{max-width:56ch}
.section-title{font-size:clamp(34px,4.8vw,60px);line-height:1.02}
.section-title.sm{font-size:clamp(26px,3.2vw,38px)}
.sub-head{margin-top:40px}
.center-row{display:flex;justify-content:center}

/* ---- Aparición con zoom ---- */
.reveal{transition:transform 1s cubic-bezier(.16,.84,.24,1),opacity .9s ease;transform-origin:50% 60%}
.reveal.pre{opacity:.12;transform:scale(.9) translateY(40px)}

/* ---- Historia de la IA ---- */
.story{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:start}
.story-stage{position:sticky;top:110px;align-self:start}
.stage-card{background:rgba(7,39,36,.72);border:1px solid var(--card-border);border-radius:24px;padding:22px 22px 18px;display:grid;gap:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-dots{list-style:none;margin:0;padding:0;display:flex;gap:8px}
.dot{width:10px;height:10px;padding:0;border-radius:999px;border:0;background:var(--line-strong);cursor:pointer;transition:width .35s cubic-bezier(.2,.8,.2,1),background-color .3s}
.dot.on{width:28px;background:var(--mint-glow);box-shadow:0 0 12px rgba(151,252,215,.6)}
.dot:hover{background:var(--teal-pulse)}
.stage-tip{font-size:14px;color:var(--muted);min-height:1.5em;text-align:center}
.net{width:100%;height:auto;display:block}
.net .edge{stroke:rgba(176,197,193,.12);stroke-width:1;transition:stroke .5s,stroke-width .5s,opacity .5s}
.net .edge.on{stroke:rgba(51,153,140,.55);stroke-dasharray:4 7;animation:flow 1.1s linear infinite}
.net .edge.on.strong{stroke:var(--mint-glow);stroke-width:2.2;opacity:.85}
@keyframes flow{to{stroke-dashoffset:-22}}
.net .node{fill:var(--forest-depths);stroke:var(--line-strong);stroke-width:1.5;transition:fill .5s,stroke .5s,filter .5s}
.net .node.on{fill:var(--shadow-teal);stroke:var(--teal-pulse)}
.net .node.l0.on{fill:var(--teal-pulse);stroke:var(--mint-glow)}
.net .node.l3.on{fill:var(--mint-glow);stroke:var(--mint-glow);filter:drop-shadow(0 0 10px rgba(151,252,215,.8))}
.net.step-datos .node.l0.on{animation:breatheNode 1.6s ease-in-out infinite alternate}
@keyframes breatheNode{from{filter:none}to{filter:drop-shadow(0 0 8px rgba(151,252,215,.75))}}
.net .net-label{fill:var(--faint);font-family:var(--f-body);font-size:13px;transition:fill .4s}
.net .net-label.on{fill:var(--fg)}
.net .out{opacity:0;transform:translateX(-8px);transition:opacity .5s,transform .5s}
.net .out.show{opacity:1;transform:none}
.net .net-out-k{fill:var(--faint);font-family:var(--f-body);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.net .net-out{fill:var(--mint-glow);font-family:var(--f-display);font-weight:600;font-size:19px}
.net .net-out-s{fill:var(--fg);font-family:var(--f-body);font-size:14px}
.net .net-cap{fill:var(--faint);font-family:var(--f-body);font-size:12px}
.story-steps{display:grid}
.story-step{min-height:62vh;display:grid;align-content:center;gap:12px;padding-block:20px;opacity:.35;transform:scale(.97);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.story-step.on{opacity:1;transform:none}
.story-step:last-child{min-height:56vh}
.story-n{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--mint-glow)}
.story-step h3{font-size:clamp(26px,3vw,36px);line-height:1.08;font-weight:600;letter-spacing:-.025em}
.story-step p{font-size:17px;line-height:1.55;max-width:40ch}
.toggles{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.toggle{display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(7,39,36,.5);color:var(--muted);font-size:15px;cursor:pointer;transition:all .25s}
.toggle:hover{border-color:var(--teal-pulse);transform:scale(1.03)}
.toggle.on{border-color:var(--mint-glow);color:var(--fg)}
.sw{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line-strong);transition:background-color .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.toggle.on .sw{background:var(--teal-pulse)}
.toggle.on .sw::after{transform:translateX(14px)}
@media (max-width:900px){
  .story{grid-template-columns:1fr;gap:0}
  .story-stage{top:84px;z-index:2}
  .stage-card{padding:14px;border-radius:20px}
  .story-step{min-height:66vh;padding-inline:4px;align-content:end;padding-bottom:12vh}
  .story-step.on{opacity:1}
  .stage-tip{display:none}
}

.sol-card,.team-card,.how-grid .card{transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s,opacity .9s}
.sol-card:hover,.how-grid .card:hover{transform:translateY(-4px)}
.sol-card.reveal.pre,.team-card.reveal.pre,.how-grid .card.reveal.pre{transform:scale(.9) translateY(40px)}

@media (prefers-reduced-motion: reduce){
  .reveal.pre{opacity:1;transform:none}
  .story-step{opacity:1;transform:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
const SECTORS=[{id:"metalurgia",label:"Metalurgia"},{id:"automocion",label:"Automoci\xF3n"},{id:"mineria",label:"Miner\xEDa"},{id:"agroindustria",label:"Agroindustria"},{id:"cemento",label:"Cemento y materiales de construcci\xF3n"},{id:"salud",label:"Salud"},{id:"gastronomia",label:"Gastronom\xEDa"},{id:"turismo",label:"Turismo"},{id:"educacion",label:"Educaci\xF3n"},{id:"tecnologia",label:"Tecnolog\xEDa"},{id:"otro",label:"Otro"}],CHALLENGES=[{id:"captacion",label:"Captaci\xF3n de clientes",hint:"Atraer prospectos y convertirlos en clientes"},{id:"seguimiento",label:"Seguimiento comercial",hint:"Dar continuidad a cotizaciones y clientes"},{id:"administrativos",label:"Procesos administrativos",hint:"Facturas, documentos y aprobaciones"},{id:"inventario",label:"Gesti\xF3n de inventario",hint:"Existencias, compras y reposici\xF3n"},{id:"agenda",label:"Organizaci\xF3n de tareas y agendas",hint:"Responsables, plazos y reuniones"},{id:"analisis",label:"An\xE1lisis de informaci\xF3n",hint:"Reportes e indicadores para decidir"},{id:"otro",label:"Otro",hint:"Un desaf\xEDo distinto a los anteriores"}],HOURS=[{id:"menos5",label:"Menos de 5 horas",hint:"Una parte menor de la semana"},{id:"5a10",label:"Entre 5 y 10 horas",hint:"Cerca de una jornada completa"},{id:"mas10",label:"M\xE1s de 10 horas",hint:"M\xE1s de una jornada a la semana"},{id:"nose",label:"No lo sabemos",hint:"Lo medimos como primer paso"}],GOALS=[{id:"tiempo",label:"Ahorrar tiempo",hint:"Menos pasos manuales y esperas"},{id:"errores",label:"Reducir errores",hint:"Datos consistentes y verificados"},{id:"ventas",label:"Mejorar las ventas",hint:"M\xE1s oportunidades bien atendidas"},{id:"informacion",label:"Organizar mejor la informaci\xF3n",hint:"Todo en un solo lugar"},{id:"decisiones",label:"Tomar mejores decisiones",hint:"Indicadores claros y a tiempo"}],STEPS=[{id:"company",short:"Empresa",type:"text"},{id:"sector",short:"Sector",type:"choice",options:SECTORS,otherKey:"sectorOther",compact:!0},{id:"challenge",short:"Desaf\xEDo",type:"choice",options:CHALLENGES,otherKey:"challengeOther"},{id:"hours",short:"Tiempo",type:"choice",options:HOURS},{id:"goal",short:"Objetivo",type:"choice",options:GOALS}],EMPTY_ANSWERS={company:"",sector:"",sectorOther:"",challenge:"",challengeOther:"",hours:"",goal:""},labelOf=(list,id)=>(list.find(o=>o.id===id)||{}).label||"",companyOr=a=>(a.company||"").trim()||"tu empresa";function stepCopy(step,a){const c=companyOr(a),ch=a.challenge==="otro"?"ese proceso":(labelOf(CHALLENGES,a.challenge)||"ese proceso").toLowerCase();switch(step){case 0:return{title:"\xBFC\xF3mo se llama tu empresa?",help:"Usaremos el nombre para personalizar la propuesta. No se guarda en ning\xFAn servidor."};case 1:return{title:`\xBFA qu\xE9 sector pertenece ${c}?`,help:"El sector ajusta el contexto de la propuesta y los ejemplos de la demostraci\xF3n."};case 2:return{title:`\xBFCu\xE1l es el principal desaf\xEDo de ${c}?`,help:"Elige el que m\xE1s limita el crecimiento hoy. Podr\xE1s cambiarlo despu\xE9s."};case 3:return{title:`\xBFCu\xE1nto tiempo dedican a ${ch} cada semana?`,help:"Una estimaci\xF3n aproximada es suficiente."};case 4:return{title:`\xBFQu\xE9 resultado le gustar\xEDa conseguir a ${c}?`,help:"Define el enfoque de la soluci\xF3n recomendada."};default:return{title:"",help:""}}}const SECTOR_CONTEXT={metalurgia:"En metalurgia, la planeaci\xF3n de materias primas y los tiempos de producci\xF3n pesan mucho sobre el margen.",automocion:"En automoci\xF3n, la coordinaci\xF3n entre repuestos, servicio y clientes define buena parte de la experiencia.",mineria:"En miner\xEDa, la continuidad operativa y la trazabilidad de insumos y equipos son cr\xEDticas.",agroindustria:"En agroindustria, la estacionalidad y el manejo de perecederos hacen que la informaci\xF3n oportuna sea decisiva.",cemento:"En cemento y materiales de construcci\xF3n, los vol\xFAmenes altos y la log\xEDstica de entrega afectan directamente los costos.",salud:"En salud, la precisi\xF3n de los re ra de saber qu\xE9 canales generan los mejores prospectos.`,opportunity:"Reunir todos los contactos entrantes en un solo registro y clasificarlos seg\xFAn su probabilidad de compra, para concentrar el esfuerzo comercial donde hay m\xE1s inter\xE9s.",solutionTitle:"Registro \xFAnico de prospectos con calificaci\xF3n asistida por IA",solutionText:"Un formulario y un tablero que centralizan los contactos de todos los canales. Un modelo sencillo asigna a cada prospecto una calificaci\xF3n seg\xFAn su origen y su interacci\xF3n, y sugiere a qui\xE9n contactar primero.",steps:[["Unificar el origen de los contactos","Inventariar los canales actuales (redes, referidos, web, ferias) y llevarlos a un formato com\xFAn."],["Definir criterios de calificaci\xF3n","Acordar con el equipo comercial qu\xE9 se\xF1ales indican inter\xE9s real y usarlas para puntuar."],["Automatizar la priorizaci\xF3n","Activar alertas para responder primero a los prospectos mejor calificados y medir la conversi\xF3n por canal."]],benefits:["Visibilidad del rendimiento de cada canal","Respuesta m\xE1s r\xE1pida a prospectos con inter\xE9s","Menos contactos olvidados","Base para decidir d\xF3nde invertir en marketing"],demo:"pipeline",demoMode:"leads",demoName:"Prospectos priorizados"},seguimiento:{summary:c=>`${c} tiene oportunidades comerciales en curso, pero el seguimiento parece depender de la memoria o de hojas sueltas, as\xED que algunas cotizaciones pueden quedarse sin respuesta.`,opportunity:"Ordenar la cartera por prioridad y programar el siguiente contacto con cada cliente, para que ninguna oportunidad se enfr\xEDe.",solutionTitle:"Tablero de seguimiento con priorizaci\xF3n autom\xE1tica",solutionText:"Un tablero que re\xFAne clientes y cotizaciones, calcula una prioridad seg\xFAn el valor estimado, la etapa y los d\xEDas sin contacto, y recuerda la pr\xF3xima acci\xF3n a cada responsable.",steps:[["Consolidar la cartera","Reunir en un solo lugar clientes activos, cotizaciones abiertas y la fec
