# Netlify: rama de producción = main (cada push a main redeploy).
# Si el build falla, el sitio muestra Page not found hasta un deploy Published.
# Variables secretas: panel → Environment variables. Pasos: docs/DESPLIEGUE.md

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
