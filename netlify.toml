# Netlify: rama de producción = main (cada push a main redeploy).
# Si el build falla, el sitio muestra Page not found hasta un deploy Published.
# Variables secretas: panel → Environment variables. Pasos: docs/DESPLIEGUE.md

[build]
  command = "npm run build"
  # El runtime de Next.js valida que publish sea `.next` (tiene BUILD_ID),
  # no la raíz del repo. No cambiar esto en el panel de Netlify.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
