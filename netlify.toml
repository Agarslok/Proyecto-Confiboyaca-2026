# Netlify: en Build & deploy → Branches, la rama de producción debe ser
# solucion-implementada (main solo tiene README; si despliega main verá Page not found).
# Variables secretas: panel → Environment variables. Pasos: docs/DESPLIEGUE.md

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
